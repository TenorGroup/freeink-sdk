<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FreeInkUI Builder</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/builder.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="brand__logo" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="6" cy="6" r="1.5"/><circle cx="13" cy="6" r="1.5"/><circle cx="20" cy="6" r="1.5"/>
          <circle class="brand__spark" cx="27" cy="6" r="1.5" opacity="0.7"/><circle class="brand__spark" cx="34" cy="6" r="1.5" opacity="0.35"/>
          <circle cx="6" cy="13" r="1.5"/><circle cx="13" cy="13" r="1.5"/><circle cx="20" cy="13" r="1.5"/>
          <circle class="brand__spark" cx="27" cy="13" r="1.5" opacity="0.7"/><circle class="brand__spark" cx="34" cy="13" r="1.5" opacity="0.7"/>
          <circle cx="6" cy="20" r="1.5"/><circle cx="13" cy="20" r="1.5"/><circle cx="20" cy="20" r="1.5"/><circle cx="27" cy="20" r="1.5"/><circle cx="34" cy="20" r="1.5"/>
          <circle cx="6" cy="27" r="1.5"/><circle cx="13" cy="27" r="1.5"/><circle cx="20" cy="27" r="1.5"/><circle cx="27" cy="27" r="1.5"/><circle cx="34" cy="27" r="1.5"/>
          <circle cx="6" cy="34" r="1.5"/><circle cx="13" cy="34" r="1.5"/><circle cx="20" cy="34" r="1.5"/><circle cx="27" cy="34" r="1.5"/><circle cx="34" cy="34" r="1.5"/>
        </svg>
        <div>
          <h1>Free<span>Ink</span></h1>
          <p>UI Builder</p>
        </div>
      </div>
      <div class="topbar__actions">
        <select id="deviceSelect" aria-label="Thiết bị xem trước"></select>
        <select id="orientationSelect" aria-label="Hướng xem trước">
          <option value="portrait">Dọc</option>
          <option value="landscape">Ngang</option>
        </select>
        <button id="importBtn" type="button">Nhập JSON</button>
        <button id="exportBtn" type="button">Xuất JSON</button>
        <button id="generateBtn" type="button" class="primary">Sinh mã C++</button>
      </div>
      <input id="fileInput" type="file" accept="application/json,.json" hidden>
    </header>

    <main class="shell">
      <aside class="panel palette">
        <div class="panel__head">
          <h2>Thành phần</h2>
          <input id="paletteFilter" type="search" placeholder="Lọc">
        </div>
        <div id="paletteList" class="palette__list"></div>
      </aside>

      <section class="stage">
        <div class="stage__toolbar">
          <label class="toolbar-field">
            <span>Màn hình</span>
            <input id="screenName" type="text" aria-label="Tên màn hình">
          </label>
          <div class="toolbar-insets" role="group" aria-label="Vùng an toàn">
            <span>Vùng an toàn</span>
            <div class="toolbar-insets__grid">
              <input id="safeAreaTop" type="number" min="0" placeholder="T" aria-label="Vùng an toàn trên">
              <input id="safeAreaRight" type="number" min="0" placeholder="R" aria-label="Vùng an toàn phải">
              <input id="safeAreaBottom" type="number" min="0" placeholder="B" aria-label="Vùng an toàn dưới">
              <input id="safeAreaLeft" type="number" min="0" placeholder="L" aria-label="Vùng an toàn trái">
            </div>
          </div>
          <div class="toolbar-insets" role="group" aria-label="Lề">
            <span>Lề</span>
            <div class="toolbar-insets__grid">
              <input id="contentMarginTop" type="number" min="0" placeholder="T" aria-label="Lề nội dung trên">
              <input id="contentMarginRight" type="number" min="0" placeholder="R" aria-label="Lề nội dung phải">
              <input id="contentMarginBottom" type="number" min="0" placeholder="B" aria-label="Lề nội dung dưới">
              <input id="contentMarginLeft" type="number" min="0" placeholder="L" aria-label="Lề nội dung trái">
            </div>
          </div>
        </div>
        <div class="device-wrap">
          <div id="devicePreview" class="device">
            <div id="screenCanvas" class="screen"></div>
          </div>
        </div>
      </section>

      <aside class="panel inspector">
        <div class="panel__head">
          <h2>Thuộc tính</h2>
          <button id="deleteBtn" type="button">Xóa</button>
        </div>
        <div id="inspectorFields" class="inspector__fields"></div>
        <div class="panel__head panel__head--sub">
          <h2>Lược đồ JSON</h2>
          <button id="applyJsonBtn" type="button">Áp dụng</button>
        </div>
        <textarea id="schemaText" spellcheck="false"></textarea>
        <div class="panel__head panel__head--sub">
          <h2>Mã C++ đã sinh</h2>
          <button id="copyCppBtn" type="button">Sao chép</button>
        </div>
        <pre id="cppOutput"></pre>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/builder.js"></script>
  </body>
</html>
